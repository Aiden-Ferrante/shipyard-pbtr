# Both suites and both contracts, on every push — test_fleet_drift.py records
# what happened while nothing enforced them: 127 violations accumulated while
# the checks sat there passing on one machine.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend pytest + frontend vitest. The suite is hermetic: tests/conftest.py
      # builds its own fixture fleet, so no ~/Desktop/code is expected here.
      - run: make test

      # The dependency rule (check-ui). The fleet-wide check skips itself when
      # the fleet-ui sibling is absent, which on a runner it always is.
      - run: make check
